# Copia de /etc/nginx/includes/server-common.conf tal cual la trae la imagen oficial
# zabbix/zabbix-web-nginx-mysql (rama 7.0 de github.com/zabbix/zabbix-docker), montada aquí
# como bind-mount de sólo lectura para poder tocar los bloques de estado sin tener que
# reconstruir la imagen. Se conservan los placeholders {HTTP_INDEX_FILE} y
# {FCGI_READ_TIMEOUT}: el entrypoint de la imagen los sustituye en el arranque igual que si
# fuera el archivo original, ya que sólo mira la ruta del archivo dentro del contenedor.
#
# Únicos dos cambios respecto al original:
#   1. location = /nginx-status: se añade "allow 172.28.55.0/24;" (subred de zabbix-net en
#      docker-compose.yml) para que zabbix-agent2, que corre en otro contenedor, pueda leer
#      el stub_status (el "allow 127.0.0.1" original sólo cubre el propio contenedor).
#   2. location ~ ^/(status|ping)$ (PHP-FPM): el original NO tenía ningún allow/deny, es
#      decir, cualquiera que llegara al puerto 8080/8443 podía leerlo. Como este stack
#      publica esos puertos directo en 80/443 del host, se añade el mismo allow + deny all
#      para no dejarlo abierto a internet, aprovechando el mismo cambio.
#
# Si cambias la subred de zabbix-net en docker-compose.yml, actualiza también el "allow" de
# ambos bloques aquí.

server_name     zabbix;
index           {HTTP_INDEX_FILE};

include /etc/nginx/includes/access-log.conf;
error_log       stderr notice;

set $webroot '/usr/share/zabbix';

root $webroot;

large_client_header_buffers 8 8k;
client_max_body_size 10M;

location = /favicon.ico {
    log_not_found off;
}

location = /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
}

# Deny all attempts to access hidden files such as .htaccess, .htpasswd, .DS_Store (Mac).
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# caching of files
location ~* \.ico$ {
    access_log off;
    expires 1y;
}

location ~* \.(js|css|png|jpg|jpeg|gif|xml|txt|svg)$ {
    expires 14d;
}

location ~* \.(woff|woff2|ttf|otf)$ {
    access_log off;
    expires 30d;
}

location ~ /(app\/|conf[^\.]|include\/|local\/|locale\/|vendor\/) {
    deny all;
    return 404;
}

location = /data/top_passwords.txt {
    deny all;
    return 404;
}

location = /nginx-status {
    access_log off;
    allow 127.0.0.1;
    allow ::1;
    allow 172.28.55.0/24;
    deny all;
    stub_status;
}

location ~ ^/(status|ping)$ {
    access_log off;
    allow 127.0.0.1;
    allow ::1;
    allow 172.28.55.0/24;
    deny all;

    fastcgi_pass                    unix:/tmp/php-fpm.sock;

    fastcgi_param  SCRIPT_FILENAME  $webroot$fastcgi_script_name;
    include fastcgi_params;
}

location / {
    try_files       $uri $uri/ =404;
}

location ~ [^/]\.php(/|$) {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    set $path_info $fastcgi_path_info;
    try_files $fastcgi_script_name =404;

    fastcgi_pass                    unix:/tmp/php-fpm.sock;
    fastcgi_index                   {HTTP_INDEX_FILE};

    fastcgi_param  DOCUMENT_ROOT    $webroot;
    fastcgi_param  SCRIPT_FILENAME  $webroot$fastcgi_script_name;
    fastcgi_param  PATH_TRANSLATED  $webroot$fastcgi_script_name;
    fastcgi_param  PATH_INFO        $path_info;

    include fastcgi_params;
    fastcgi_param  QUERY_STRING     $query_string;
    fastcgi_param  REQUEST_METHOD   $request_method;
    fastcgi_param  CONTENT_TYPE     $content_type;
    fastcgi_param  CONTENT_LENGTH   $content_length;

    fastcgi_intercept_errors        on;
    fastcgi_ignore_client_abort     off;
    fastcgi_connect_timeout         60;
    fastcgi_send_timeout            180;
    fastcgi_read_timeout            {FCGI_READ_TIMEOUT};
    fastcgi_buffer_size             128k;
    fastcgi_buffers                 4 256k;
    fastcgi_busy_buffers_size       256k;
    fastcgi_temp_file_write_size    256k;
}
